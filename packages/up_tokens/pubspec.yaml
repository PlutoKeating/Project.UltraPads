name: up_tokens
description: "UltraPads design tokens: generated W3C DTCG constants and the UpTheme ThemeExtension runtime (skins, glow, typography, motion)."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Open-source fallback for the commercial Uni Sans family (SIL OFL 1.1, see
  # assets/fonts/OFL.txt). Referenced as `packages/up_tokens/Montserrat`.
  # The private Uni Sans cuts are injected into the *app* bundle at build time
  # (assets/private_manifest/font__*.ttf, see `just inject-assets`) and registered at runtime by UpFonts.loadPrivate().
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Thin.ttf
          weight: 100
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
