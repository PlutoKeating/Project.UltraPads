name: up_tokens
description: "UltraPads design tokens: generated W3C DTCG constants and the UpTheme ThemeExtension runtime (skins, skin presets, glow, typography, motion)."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Open Sans (SIL OFL 1.1, see assets/fonts/OFL.txt) — the default text font.
  # Referenced as `packages/up_tokens/Open Sans`. The optional Uni Sans
  # skin font (commercial) is injected into the *app* bundle
  # (assets/private_manifest/font__*.ttf, see `just inject-assets`) and
  # registered at runtime by UpFonts.loadPrivate().
  fonts:
    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-ExtraBold.ttf
          weight: 800
