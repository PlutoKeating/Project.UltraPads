name: up_ui
description: "UltraPads component library. Pure presentation: receives data and callbacks; all values from up_tokens (UpTheme); effects from up_fx. Never depends on up_engine."
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  up_tokens: ^0.0.1
  up_fx: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
