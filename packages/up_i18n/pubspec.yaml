name: up_i18n
description: "UltraPads localisation: ARB sources, generated UpL10n (gen-l10n), LocaleController and locale scaffolding scripts."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

executables:
  add_locale:
  check:
  gen:

flutter:
  # Runs gen-l10n (l10n.yaml) on `flutter pub get` / build. Output in
  # lib/src/generated/ is committed so consumers never need the generator.
  generate: true
