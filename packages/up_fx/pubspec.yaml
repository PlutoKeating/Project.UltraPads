name: up_fx
description: "UltraPads motion & light effects: segmented Lottie pad animations, fragment-shader glow/ripple/breathe, device-tiered fallbacks, springs, reduced-motion, Rive host."
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.3.0
  rive: ^0.13.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/neon_bloom.frag
    - shaders/press_ripple.frag
    - shaders/loop_breathe.frag
    - shaders/dither_gradient.frag
