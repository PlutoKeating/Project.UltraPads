[workspace]
resolver = "3"
# third_party/ 下是打了补丁的上游 crate（经下方 [patch.crates-io] 引用），不是工作区成员
exclude = ["third_party"]
members = [
  "engine/*",
  "runtime/up-host",
  "runtime/up-library",
  "runtime/up-split",
  "runtime/up-hub",
  "runtime/up-cli",
  "runtime/up-update",
  "tools/catalog/pack",
  "bridge/up-ffi",
]

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/PlutoKeating/Project.UltraPads"
rust-version = "1.85"

[workspace.dependencies]
up-core = { path = "engine/up-core" }
up-rt = { path = "engine/up-rt" }
up-dsp = { path = "engine/up-dsp" }
up-graph = { path = "engine/up-graph" }
up-sampler = { path = "engine/up-sampler" }
up-transport = { path = "engine/up-transport" }
up-sequencer = { path = "engine/up-sequencer" }
up-mixer = { path = "engine/up-mixer" }
up-recorder = { path = "engine/up-recorder" }
up-model = { path = "engine/up-model" }
up-codec = { path = "engine/up-codec" }
up-protocol = { path = "engine/up-protocol" }
up-engine = { path = "engine/up-engine" }
up-host = { path = "runtime/up-host" }
up-library = { path = "runtime/up-library" }
up-hub = { path = "runtime/up-hub" }
up-update = { path = "runtime/up-update" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# cpal 补丁版：Android 输出流请求 AAudio EXCLUSIVE（MMAP）模式，见 third_party/cpal/ULTRAPADS_PATCH.md
[patch.crates-io]
cpal = { path = "third_party/cpal" }
