[package]
name = "up-catalog-pack"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UltraPads catalog pipeline helper: pack .upkit, render MIDI with SoundFont, verify packages"
publish = false

[[bin]]
name = "up-catalog-pack"
path = "src/main.rs"

[dependencies]
up-format = { path = "../../../engine/up-format" }
up-library = { workspace = true, default-features = false }
up-codec = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustysynth = "1.3"

[dev-dependencies]
tempfile = "3"
