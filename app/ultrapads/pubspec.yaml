name: ultrapads
description: "UltraPads — pad performance & music creation app (Flutter + Rust engine)."
publish_to: 'none'
version: 0.0.1+1

resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  up_ffi:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  up_engine: ^0.0.1
  up_tokens: ^0.0.1
  up_i18n: ^0.0.1
  up_ui: ^0.0.1
  up_fx: ^0.0.1
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0
  shared_preferences: ^2.5.0
  path_provider: ^2.1.5
  file_picker: ^13.0.0
  permission_handler: ^13.0.0
  share_plus: ^13.0.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    # 入库的占位清单目录（永远存在）。注入的私有素材也平铺在这里（被目录内 .gitignore 忽略），
    # 见 tools/assets/inject_private_assets.dart 和 docs/README.md「私有素材」。
    - assets/private_manifest/
    # CC0 示例 Kit（content/kits/*.upkit 的副本，测试保证一致），首次启动导入曲库。
    - assets/kits/
