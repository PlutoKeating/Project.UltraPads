[package]
name = "up_ffi"
description = "UltraPads FFI surface for Flutter (flutter_rust_bridge)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
up-core = { workspace = true }
up-protocol = { workspace = true }
up-engine = { workspace = true }
up-host = { workspace = true }
up-model = { workspace = true }
up-codec = { workspace = true }
up-library = { workspace = true }
arc-swap = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
