[package]
name = "up-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UltraPads personal multi-device hub: LAN discovery, pairing, library sync, remote pad controller"

# 注意：只用 rustls 的 ring 后端（不引入 aws-lc-rs），以便 Android NDK 交叉编译。
[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
blake3 = "1"
bytes = "1"
data-encoding = "2"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "zeroize"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }
mdns-sd = "0.21"
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
spake2 = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tracing = "0.1"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc", "ring", "std"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
