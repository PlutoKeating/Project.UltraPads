[package]
name = "up-update"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UltraPads self-update: release manifest (/api/version), verified download with mirror fallback, Linux versioned install swap"

[dependencies]
up-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
log = "0.4"
# rustls + ring（与 up-hub 同一 TLS 栈，Android NDK 可交叉编译），证书用内置 webpki-roots，不依赖系统证书库
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tempfile = "3"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
