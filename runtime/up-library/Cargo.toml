[package]
name = "up-library"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UltraPads library: kit/sample/track storage, .upkit import/export, SFZ/WAV-folder/original-app importers"

[features]
default = ["hub"]
## 实现 up-hub 的 `LibraryStore`（多设备同步）。
hub = ["dep:up-hub", "dep:async-trait", "dep:tokio"]

[dependencies]
up-format = { path = "../../engine/up-format" }
up-codec = { workspace = true }
up-core = { workspace = true }
up-model = { workspace = true }
up-protocol = { workspace = true }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
up-hub = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync"], optional = true }

[dev-dependencies]
jsonschema = { version = "0.59", default-features = false }
tempfile = "3"
up-core = { workspace = true }
up-model = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
up-hub = { workspace = true }

[[example]]
name = "kitgen"
path = "examples/kitgen.rs"
