[package]
name = "up-host"
description = "UltraPads runtime host: audio devices (cpal), input capture, kit folder loading, track storage, app core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
up-core = { workspace = true }
up-protocol = { workspace = true }
up-engine = { workspace = true }
up-codec = { workspace = true }
up-model = { workspace = true }
up-recorder = { workspace = true }
# `realtime`: AAudio requests PERFORMANCE_MODE_LOW_LATENCY (without it Android
# streams take the normal mixer path, tens of ms slower) and the callback
# thread is promoted to real-time priority.
# `pipewire` (Linux): native PipeWire host, preferred by `default_host()` when
# a PipeWire daemon runs (falls back to ALSA): no ALSA-plugin ring buffer,
# ~3.8 ms command → DAC instead of ~10–18 ms. Builds need libpipewire-0.3-dev
# + libspa-0.2-dev (≥ 0.3.65, Debian 12) and clang.
# `realtime-dbus` (Linux): real-time priority for the stream thread via rtkit
# (unprivileged users have RLIMIT_RTPRIO 0); needs libdbus-1-dev.
cpal = { version = "0.18", features = ["realtime", "realtime-dbus", "pipewire"] }
blake3 = "1"
uuid = { version = "1", features = ["v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
crossbeam-channel = "0.5"
arc-swap = "1"
rtrb = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# Same version cpal uses; only to silence ALSA's stderr probe noise.
alsa = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"

[dev-dependencies]
up-codec = { workspace = true }
