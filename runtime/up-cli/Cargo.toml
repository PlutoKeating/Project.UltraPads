[package]
name = "up-cli"
description = "UltraPads headless CLI: devices, offline render, play, latency probe"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "up-cli"
path = "src/main.rs"

[dependencies]
up-core = { workspace = true }
up-engine = { workspace = true }
up-host = { workspace = true }
up-codec = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
hound = "3.5"
env_logger = "0.11"
log = "0.4"
