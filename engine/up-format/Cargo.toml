[package]
name = "up-format"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UltraPads pure format layer: SFZ, .upkit JSON models, WAV metadata chunks, SMF, DAWproject (no I/O)"

[dependencies]
up-core = { workspace = true }
up-model = { workspace = true }
blake3 = "1"
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
jsonschema = { version = "0.59", default-features = false }
