# ultrapads-data：一个容器。只发布到本机 127.0.0.1:${ULTRAPADS_DATA_LOCAL_PORT}，由服务器上已有的反向隧道（Cloudflare Tunnel）转发。
# 数据在 ./data（SQLite、files/ 下的 .upkit 与每日备份）。变量来自同目录的 .env（start.sh 生成，权限 600，不入库）。
name: ultrapads-data

services:
  data:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: ultrapads-data:local
    restart: unless-stopped
    environment:
      ULTRAPADS_DATA_KEY: ${ULTRAPADS_DATA_KEY:?请运行 ./start.sh 生成 ULTRAPADS_DATA_KEY}
      ULTRAPADS_ADMIN_KEY: ${ULTRAPADS_ADMIN_KEY:?请运行 ./start.sh 生成 ULTRAPADS_ADMIN_KEY}
      ULTRAPADS_DATA_DIR: /data
      ULTRAPADS_DATA_PORT: "8080"
    ports:
      - "127.0.0.1:${ULTRAPADS_DATA_LOCAL_PORT:-8791}:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
